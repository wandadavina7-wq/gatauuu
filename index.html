A:[["Why do detectives describe people?","<p>Detective Rina cannot find a thief with just a name. She needs to know: <b>What does the person look like? How does the person behave?</b></p><p>So she reads and writes a special kind of text. It is called a <b>descriptive text</b>.</p>","Detektif butuh gambaran orang, bukan hanya nama."],
 ["What is a descriptive text?","<p>A <b>descriptive text</b> tells us about a person, an animal, a place or a thing.</p><p>It gives details. The reader can imagine the person, like a picture in the head.</p><p><i>Example:</i> “Ms. Lina is tall and slim. She has long black hair.”</p>","Descriptive text = teks deskriptif, yaitu teks yang menggambarkan sesuatu dengan detail."],
 ["What is its purpose?","<p>The purpose is <b>to describe a particular person</b> clearly.</p><p>In our case, the description helps the police to <b>recognise the thief</b>. Good details = easy to catch!</p>","Tujuan: menggambarkan seseorang dengan jelas."],
 ["Structure part 1: Identification","<p>The first part is <span class='i'>Identification</span>. It tells us <b>WHO</b> we describe.</p><p><span class='i'>I want to tell you about a woman in my shop.</span></p><p>Short and simple. Only the person’s name or who the person is.</p>","Identification = pengenalan: siapa yang dideskripsikan."],
 ["Structure part 2: Description","<p>The second part is <span class='d'>Description</span>. It gives the <b>details</b>. Follow this order:</p><p>1️⃣ Body: tall, slim<br>2️⃣ Face and hair: long black hair<br>3️⃣ Clothes: a blue jacket<br>4️⃣ Personality: shy, quiet</p><p><span class='d'>She is tall and slim. She has long black hair. She wears a blue jacket. She is shy.</span></p>","Description = rincian ciri: tubuh, wajah/rambut, pakaian, sifat."]],
B:[["Feature 1: Adjectives","<p>An <b>adjective</b> describes a noun (a person or a thing).</p><p>Body: <b>tall, short, slim, fat</b><br>Hair: <b>long, short, curly, straight</b><br>Personality: <b>shy, kind, funny, brave</b></p><p>She is <b>tall</b>. He has <b>curly</b> hair.</p>","Adjective = kata sifat."],

 ["Feature 3: Simple present tense","<p>We use <b>simple present</b> to describe facts about a person.</p><p><b>be:</b> I <b>am</b> shy. She <b>is</b> tall. They <b>are</b> kind.</p>","Simple present dipakai untuk fakta dan deskripsi."],

 view(`<div class="panel"><p style="margin:0"><b>Tonight at Nusantara Museum,</b> the giant Garuda Emerald disappeared from its glass case. The alarm did not ring. Six people were inside. Tap the objects on your desk, Detective ${esc(S.name)}!</p></div>

${ob("map()","Case Book",160,478,`<g stroke="${L}" stroke-width="4" stroke-linejoin="round"><rect x="70" y="360" width="180" height="100" rx="6" fill="#7b1c24"/><rect x="82" y="352" width="160" height="96" fill="#f3ead2"/><rect x="154" y="352" width="8" height="96" fill="#7b1c24"/><path d="M96 372h44M96 388h44M96 404h30M176 372h50M176 388h50" stroke="#8a7a58" stroke-width="3" fill="none"/><path d="M215 448v34l8-8l8 8v-34z" fill="#f5c542"/></g>`)}

${ob("tips()","Tips",490,478,`<g stroke="${L}" stroke-width="4" stroke-linecap="round"><circle cx="490" cy="405" r="42" fill="#bfe3ff77" stroke="#d3a42c" stroke-width="9"/><path d="M468 392q8-14 24-14" stroke="#fff" fill="none"/><line x1="520" y1="435" x2="560" y2="480" stroke="#5a3a1e" stroke-width="14"/></g>`,90)}

function sus(){view(`<div class="panel"><h2>Suspect Line-up</h2><p>Six people were inside the museum. Tap a suspect to see the profile.</p></div><div class="scroll"><svg viewBox="0 0 920 300" style="min-width:780px;width:100%;display:block"><defs><linearGradient id="lw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef1f4"/><stop offset="1" stop-color="#b9c1ca"/></linearGradient></defs><rect width="920" height="300" fill="url(#lw)"/>${[190,180,170,160,150,140].map(c=>{const y=28+(185-c)*1.286;return `<path d="M0 ${y}H920" stroke="#7a8794" stroke-width="${c%20?1:2}"/>${c%20?"":`<text x="8" y="${y-3}" font-family="Barlow Condensed" font-weight="700" font-size="15" fill="#4a5764">${c} cm</text>`}`}).join("")}${SK.map((k,i)=>{const s=SUS[k],x=i*150+10,y=(185-s.cm)*1.286,out=S.elim.includes(k);return `<g class="sp" tabindex="0" role="button" aria-label="${s.n}" onclick="prof('${k}')" onkeydown="if(event.key=='Enter')prof('${k}')" opacity="${out?.45:1}"><svg x="${x}" y="${y}" width="150" height="196" viewBox="0 0 200 262">${person(s.o).replace(/<svg[^>]*>|<\/svg>/g,"")}</svg><rect x="${x+10}" y="262" width="130" height="28" rx="6" fill="#0d2540" stroke="#f5c542" stroke-width="2.5"/><text x="${x+75}" y="282" class="lab">${s.n}</text>${out?`<text x="${x+75}" y="190" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="30" fill="#c0272d" stroke="#fff" stroke-width=".8" transform="rotate(-12 ${x+75} 190)">CLEARED</text>`:""}</g>`}).join("")}</svg></div>`)}
function prof(k){const s=SUS[k],i=SK.indexOf(k),out=S.elim.includes(k);view(`<div class="panel" style="background:linear-gradient(#e9eef3,#c3cfdb)"><h2>${s.n} <small style="font-size:20px">· ${s.j}</small></h2>${out?`<span class="stamp">CLEARED</span>`:""}<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center"><div style="width:230px;max-width:100%;background:linear-gradient(#eef1f4,#b9c1ca);border:3px solid #12263b;border-radius:10px;margin:auto">${person(s.o)}</div><div style="flex:1;min-width:230px"><div class="tiles"><div class="tile"><div>📏</div>${s.cm} cm</div><div class="tile"><div>${s.g=="Male"?"👨":"👩"}</div>${s.g}</div><div class="tile"><div>💇</div>${s.hair}</div><div class="tile"><div>👓</div>${s.gl}</div><div class="tile"><div>🎽</div>${s.ac}</div><div class="tile"><div>🙂</div>${s.f}</div></div></div></div></div><button class="gb" onclick="prof('${SK[(i+5)%6]}')">◀ Back</button><button class="gb gold" onclick="sus()">Line-up</button><button class="gb" onclick="prof('${SK[(i+1)%6]}')">Next ▶</button>`)}
function evid(){view(`<div class="panel"><h2>Evidence Bag</h2><p>Items found at the crime scene. Match them with the suspects!</p><div class="ev">${EV.map((e,i)=>{const open=i<S.step*0+[0,2,4].filter(()=>1).length*0+evN();return `<div class="evc ${i<evN()?"":"lk"}"><div class="ic">${i<evN()?e[0]:"❓"}</div><div><b class="cd" style="font-size:20px">Evidence ${i+1}${i<evN()?": "+e[1]:""}</b><br>${i<evN()?e[2]:"Solve a case to find it."}</div></div>`}).join("")}</div></div>`)}
const evN=()=>[1,2,3].filter(done).length*2;
function tips(){view(`<div class="panel"><h2>Detective Tips</h2>${TIPS.map(t=>`<p>🔎 ${t}</p>`).join("")}</div>`)}
function map(){view(`<div class="panel"><span class="stamp">TOP SECRET</span><h2>Case Book: The Garuda Emerald</h2><p>Follow the route. Read a file, then solve the case.</p>${ROUTE.map((r,i)=>{const st=i<S.step?"done":i==S.step?"open":"lock";return `<div class="node ${st}"><div class="badge">${st=="done"?"✔":st=="lock"?"🔒":i+1}</div><div style="flex:1"><b>${r.title}</b><br><small>${r.sub}</small></div><button class="gb ${st=="open"?"gold":""}" ${st=="lock"?"disabled":""} onclick="${r.t=="f"?`file('${r.k}',0)`:`kase(${r.k})`}">${st=="done"?"REVIEW":"OPEN"}</button></div>`}).join("")}</div>`)}
function file(k,p){const F=FILES[k],l=p==F.length-1;view(`<div class="panel paper"><span class="stamp">FILE ${k=="A"?1:2}</span><h2>${F[p][0]}</h2>${F[p][1]}<div class="gl">🇮🇩 ${F[p][2]}</div><p><small>Page ${p+1} of ${F.length}</small></p>${p?`<button class="gb" onclick="file('${k}',${p-1})">◀ Back</button>`:""}${l?`<button class="gb gold" onclick="read('${k}')">✔ Got it!</button>`:`<button class="gb gold" onclick="file('${k}',${p+1})">Next ▶</button>`}</div>`)}
function read(k){const i=ROUTE.findIndex(r=>r.id=="f"+k)+1;if(S.step<i){S.step=i;S.score+=5;sfx("rev")}save();map()}
function kase(n){const C=CASES[n];cur={n,ok:[],w:[],h:[]};view(`<div class="panel paper"><span class="stamp">CASE ${n}</span><h3 style="font-size:26px">${C.by}</h3><p>${C.text}</p><div class="ev">${C.ev.map(i=>`<div class="evc"><div class="ic">${EV[i][0]}</div><div><b class="cd" style="font-size:19px">Evidence ${i+1}: ${EV[i][1]}</b><br>${EV[i][2]}</div></div>`).join("")}</div></div><div class="panel"><button class="gb" style="float:right" onclick="modal('<h2>Suspects</h2><p>Open the Suspects tab at the bottom to see all profiles.</p><button class=\\'gb\\' onclick=\\'closeM()\\'>OK</button>')">Help</button><h2>Questions</h2>${C.qs.map((q,i)=>`<div class="q" id="q${i}"><b>${i+1}. ${q.q}</b>${q.o.map((o,j)=>`<button class="opt" onclick="ans(${i},${j})">${o}</button>`).join("")}<button class="gb" style="padding:3px 10px;font-size:16px" onclick="hint(${i})">💡 Hint (-1)</button><div id="h${i}"></div></div>`).join("")}<div id="fin" hidden><button class="gb gold" style="font-size:22px" onclick="fin(${n})">🔎 Reveal the clue</button></div></div>`)}
function ans(i,j){const q=CASES[cur.n].qs[i];if(cur.ok[i])return;const b=document.querySelectorAll(`#q${i} .opt`)[j];if(j===q.a){b.classList.add("good");cur.ok[i]=1;S.score+=cur.w[i]?5:10;sfx("ok")}else{b.classList.add("bad");b.disabled=true;cur.w[i]=1;sfx("bad")}save();hud();if(cur.ok.filter(Boolean).length==4)$("#fin").hidden=false}
function hint(i){if(!cur.h[i]){cur.h[i]=1;S.hints++;S.score=Math.max(0,S.score-1);save();hud()}$("#h"+i).innerHTML=`<div class="hint">💡 ${CASES[cur.n].qs[i].h}</div>`}
function fin(n){const C=CASES[n];C.elim.forEach(e=>{if(!S.elim.includes(e))S.elim.push(e)});S.step=Math.max(S.step,ROUTE.findIndex(r=>r.id=="c"+n)+1);save();sfx("rev");hud();modal(`<h2>🔎 Clue found!</h2><p>${C.clue}</p><p><small>Progress saved. Tap REPORT to email your teacher.</small></p><button class="gb gold" onclick="closeM();${n==3?"ending()":"map()"}">Continue</button>`)}
function ending(){const r=S.score>=150?"Chief Detective":S.score>=110?"Senior Detective":"Junior Detective";view(`<div class="panel tc"><span class="stamp">CASE CLOSED</span><h2>🚔 Caught!</h2><div style="width:210px;margin:auto;background:linear-gradient(#eef1f4,#b9c1ca);border:3px solid #12263b;border-radius:10px">${person(SUS.nadia.o)}</div><p><b>Nadia</b> took the Garuda Emerald. She is tall and slim, she has long black hair, and she wears round glasses. She only wanted to copy it for an art contest, but taking it without asking is wrong. The emerald is safe again!</p><p class="cd" style="font-size:24px">Rank: ${r} · 🪙 ${S.score} · Hints: ${S.hints}</p><a class="gb gold" href="${rep().href}">✉ Email report to teacher</a></div>`)}
function report(){const r=rep();view(`<div class="panel"><span class="stamp">REPORT</span><h2>Send report to teacher</h2><p>To: <b>${esc(S.email)}</b></p><pre style="white-space:pre-wrap;font:inherit;background:#fff;border:3px solid #12263b;border-radius:8px;padding:10px">${esc(r.b)}</pre><p><small>Your email app opens with the report ready. Press Send there. You can do this at any time.</small></p><a class="gb gold" href="${r.href}">✉ Open email</a></div>`)}
cover();
